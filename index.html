<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Holo Card</title>

<style>

/* =========================================================
   基础
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(90, 90, 120, 0.14),
      transparent 40%
    ),
    #050508;

  user-select: none;
  -webkit-user-select: none;

  overscroll-behavior: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;

  touch-action: none;
}


/* =========================================================
   舞台
========================================================= */

.stage {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  perspective: 1400px;

  touch-action: none;
}


/* =========================================================
   卡牌
========================================================= */

.card {
  position: relative;

  width: min(
    320px,
    78vw,
    calc(100vw - 36px),
    calc(100dvh - 36px)
  );

  aspect-ratio: 0.718;

  perspective: 1400px;

  touch-action: none;

  pointer-events: auto;

  cursor: pointer;
}


/* =========================================================
   3D 旋转层
========================================================= */

.card__rotator {
  position: absolute;
  inset: 0;

  overflow: hidden;

  border-radius: 18px;

  transform-style: preserve-3d;

  transform:
    rotateX(var(--rx, 0deg))
    rotateY(var(--ry, 0deg))
    translateZ(0);

  will-change: transform;

  background: #08080d;

  box-shadow:
    0 26px 60px rgba(0,0,0,0.42),
    0 8px 22px rgba(0,0,0,0.28);

  transition:
    box-shadow 0.2s ease;
}


/* =========================================================
   原始卡牌
========================================================= */

.card__image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  border-radius: inherit;

  pointer-events: none;

  backface-visibility: hidden;

  -webkit-user-drag: none;
  user-drag: none;
}


/* =========================================================
   第一层：
   柔和连续的彩色全息膜
========================================================= */

.card__holo {
  position: absolute;

  inset: -35%;

  pointer-events: none;

  opacity: 0.70;

  mix-blend-mode: color-dodge;

  background:

    /* 柔和大色块 */
    radial-gradient(
      ellipse at
      calc(50% + var(--holo-x, 0%))
      calc(50% + var(--holo-y, 0%)),
      rgba(255, 105, 220, 0.24) 0%,
      rgba(255, 40, 170, 0.12) 15%,
      transparent 38%
    ),

    radial-gradient(
      ellipse at
      calc(20% + var(--holo-x, 0%))
      calc(75% + var(--holo-y, 0%)),
      rgba(40, 255, 230, 0.18),
      transparent 38%
    ),

    radial-gradient(
      ellipse at
      calc(82% + var(--holo-x, 0%))
      calc(28% + var(--holo-y, 0%)),
      rgba(90, 130, 255, 0.20),
      transparent 40%
    ),

    /* 连续色谱 */
    linear-gradient(
      112deg,
      rgba(255, 0, 100, 0.16) 0%,
      rgba(255, 160, 0, 0.12) 18%,
      rgba(0, 255, 225, 0.14) 38%,
      rgba(30, 130, 255, 0.16) 56%,
      rgba(170, 20, 255, 0.17) 75%,
      rgba(255, 0, 150, 0.14) 100%
    );

  filter:
    saturate(1.7)
    contrast(1.1);

  transform:
    translate3d(
      var(--holo-x, 0%),
      var(--holo-y, 0%),
      25px
    )
    rotate(7deg)
    scale(1.20);

  transition:
    transform 0.08s linear;
}


/* =========================================================
   第二层：
   极细的彩虹干涉纹
========================================================= */

.card__interference {
  position: absolute;

  inset: -30%;

  pointer-events: none;

  opacity: 0.36;

  mix-blend-mode: screen;

  background:

    repeating-linear-gradient(
      103deg,

      rgba(255, 40, 130, 0.00) 0px,
      rgba(255, 40, 130, 0.055) 5px,

      rgba(255, 180, 20, 0.00) 10px,
      rgba(255, 180, 20, 0.048) 15px,

      rgba(30, 255, 220, 0.00) 20px,
      rgba(30, 255, 220, 0.058) 25px,

      rgba(70, 130, 255, 0.00) 30px,
      rgba(70, 130, 255, 0.052) 35px,

      rgba(210, 50, 255, 0.00) 40px,
      rgba(210, 50, 255, 0.058) 45px
    );

  transform:
    translate3d(
      calc(var(--holo-x, 0%) * 0.45),
      calc(var(--holo-y, 0%) * 0.45),
      35px
    )
    rotate(-8deg)
    scale(1.12);

  filter:
    blur(0.15px)
    saturate(1.4);

  transition:
    transform 0.09s linear;
}


/* =========================================================
   第三层：
   非常细密的金属纹
========================================================= */

.card__micro-lines {
  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0.24;

  mix-blend-mode: overlay;

  background:

    repeating-linear-gradient(
      96deg,
      rgba(255,255,255,0.00) 0px,
      rgba(255,255,255,0.00) 2px,

      rgba(255,255,255,0.055) 2.5px,

      rgba(255,255,255,0.00) 4px,
      rgba(255,255,255,0.00) 7px
    );
}


/* =========================================================
   第四层：
   大面积柔光
========================================================= */

.card__iridescence {
  position: absolute;

  inset: -35%;

  pointer-events: none;

  opacity: 0.58;

  mix-blend-mode: screen;

  background:

    radial-gradient(
      ellipse at
      var(--light-x, 50%)
      var(--light-y, 50%),

      rgba(255,255,255,0.70) 0%,

      rgba(255,255,255,0.24) 7%,

      rgba(255,120,230,0.12) 15%,

      rgba(90,230,255,0.07) 24%,

      transparent 46%
    );

  filter: blur(9px);

  transform:
    translateZ(40px)
    scale(1.15);

  transition:
    opacity 0.12s linear;
}


/* =========================================================
   第五层：
   主闪光
========================================================= */

.card__specular {
  position: absolute;

  inset: -45%;

  pointer-events: none;

  mix-blend-mode: screen;

  opacity: var(--specular-opacity, 0.78);

  background:

    radial-gradient(
      ellipse
      at var(--light-x, 50%)
      var(--light-y, 50%),

      rgba(255,255,255,0.96) 0%,

      rgba(255,255,255,0.78) 3%,

      rgba(255,255,255,0.34) 10%,

      rgba(255,255,255,0.11) 20%,

      transparent 44%
    );

  filter:
    blur(2px);

  transform:
    translateZ(65px)
    scale(1.18);

  transition:
    opacity 0.10s linear;
}


/* =========================================================
   第六层：
   狭长的“闪卡闪线”
========================================================= */

.card__flash {
  position: absolute;

  inset: -100%;

  pointer-events: none;

  mix-blend-mode: screen;

  opacity: var(--flash-opacity, 0.72);

  background:

    linear-gradient(
      108deg,

      transparent 37%,

      rgba(255,255,255,0.00) 43%,

      rgba(255,255,255,0.14) 46%,

      rgba(255,255,255,0.92) 49%,

      rgba(255,255,255,0.42) 51%,

      rgba(255,255,255,0.08) 54%,

      transparent 62%
    );

  transform:

    translate3d(
      var(--flash-x, 0%),
      var(--flash-y, 0%),
      90px
    )

    rotate(10deg)
    scale(1.15);

  filter:
    blur(1px);

  transition:
    transform 0.08s linear,
    opacity 0.1s linear;
}


/* =========================================================
   第七层：
   彩色闪光带
========================================================= */

.card__color-flash {
  position: absolute;

  inset: -100%;

  pointer-events: none;

  opacity: var(--color-flash-opacity, 0.62);

  mix-blend-mode: screen;

  background:

    linear-gradient(
      112deg,

      transparent 34%,

      rgba(255, 0, 120, 0.00) 41%,

      rgba(255, 40, 150, 0.22) 44%,

      rgba(255, 190, 0, 0.30) 47%,

      rgba(0, 255, 225, 0.28) 50%,

      rgba(70, 130, 255, 0.24) 53%,

      rgba(210, 30, 255, 0.22) 56%,

      transparent 63%
    );

  transform:

    translate3d(
      calc(var(--flash-x, 0%) * 0.72),
      calc(var(--flash-y, 0%) * 0.72),
      100px
    )

    rotate(10deg)
    scale(1.15);

  filter:
    blur(3px)
    saturate(1.7);

  transition:
    transform 0.08s linear;
}


/* =========================================================
   第八层：
   局部高亮切面
========================================================= */

.card__highlight {
  position: absolute;

  inset: -20%;

  pointer-events: none;

  opacity: 0.34;

  mix-blend-mode: screen;

  background:

    linear-gradient(
      145deg,

      transparent 0%,

      transparent 36%,

      rgba(255,255,255,0.02) 42%,

      rgba(255,255,255,0.13) 49%,

      rgba(255,255,255,0.025) 54%,

      transparent 62%,

      transparent 100%
    );

  transform:
    translate3d(
      calc(var(--flash-x, 0%) * 1.1),
      calc(var(--flash-y, 0%) * 1.1),
      80px
    );

  transition:
    transform 0.08s linear;
}


/* =========================================================
   第九层：
   边缘彩色折射
========================================================= */

.card__edge-color {
  position: absolute;

  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  opacity: 0.72;

  mix-blend-mode: screen;

  box-shadow:

    inset 2px 0 0 rgba(255,80,170,0.18),

    inset -2px 0 0 rgba(70,170,255,0.19),

    inset 0 2px 0 rgba(255,210,80,0.12),

    inset 0 -2px 0 rgba(60,255,220,0.14);
}


/* =========================================================
   普通边缘
========================================================= */

.card__edge {
  position: absolute;

  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  border:
    1px solid rgba(255,255,255,0.26);

  box-shadow:

    inset
    0 0 14px
    rgba(255,255,255,0.10),

    inset
    0 0 34px
    rgba(255,255,255,0.035);
}


/* =========================================================
   颗粒
========================================================= */

.card__grain {
  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0.085;

  mix-blend-mode: overlay;

  background-image:

    radial-gradient(
      rgba(255,255,255,0.65) 0.55px,
      transparent 0.7px
    );

  background-size:
    4px 4px;
}


/* =========================================================
   暗角
========================================================= */

.card__vignette {
  position: absolute;

  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  background:

    radial-gradient(
      circle at center,

      transparent 48%,

      rgba(0,0,0,0.05) 68%,

      rgba(0,0,0,0.16) 84%,

      rgba(0,0,0,0.32) 100%
    );
}


/* =========================================================
   小屏
========================================================= */

@media (max-width: 480px) {

  .card {

    width: min(
      78vw,
      300px,
      calc(100vw - 36px),
      calc(100dvh - 36px)
    );
  }

  .card__rotator {
    border-radius: 16px;
  }
}


/* =========================================================
   横屏手机
========================================================= */

@media (orientation: landscape) and (max-height: 600px) {

  .card {

    height: min(
      84dvh,
      430px
    );

    width: auto;

    aspect-ratio: 0.718;
  }
}

</style>
</head>


<body>

<div class="stage" id="stage">

  <div class="card" id="card">

    <div class="card__rotator" id="rotator">

      <!-- 原始卡牌 -->

      <img
        class="card__image"
        src="./card.png"
        alt=""
        draggable="false"
      >


      <!-- 全息效果 -->

      <div class="card__holo"></div>

      <div class="card__interference"></div>

      <div class="card__micro-lines"></div>

      <div class="card__iridescence"></div>

      <div class="card__specular"></div>

      <div class="card__flash"></div>

      <div class="card__color-flash"></div>

      <div class="card__highlight"></div>

      <div class="card__edge-color"></div>

      <div class="card__grain"></div>

      <div class="card__edge"></div>

      <div class="card__vignette"></div>

    </div>

  </div>

</div>


<script>

(() => {

  /* ========================================================
     元素
  ======================================================== */

  const rotator =
    document.getElementById("rotator");


  /* ========================================================
     核心参数
  ======================================================== */

  const MAX_ROTATE = 18;

  const SENSOR_SMOOTH = 0.16;


  /* ========================================================
     当前/目标角度
  ======================================================== */

  let targetX = 0;
  let targetY = 0;

  let currentX = 0;
  let currentY = 0;


  /* ========================================================
     光源
  ======================================================== */

  let targetLightX = 50;
  let targetLightY = 50;

  let lightX = 50;
  let lightY = 50;


  /* ========================================================
     全息位移
  ======================================================== */

  let holoX = 0;
  let holoY = 0;


  /* ========================================================
     闪光
  ======================================================== */

  let flashX = 0;
  let flashY = 0;


  /* ========================================================
     手机传感器
  ======================================================== */

  let sensorStarted = false;

  let baseBeta = null;
  let baseGamma = null;


  /* ========================================================
     工具
  ======================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  function lerp(a, b, t) {

    return a + (b - a) * t;

  }


  /* ========================================================
     计算闪光强度
  ======================================================== */

  function getTiltAmount() {

    const amount =
      Math.sqrt(
        currentX * currentX +
        currentY * currentY
      );

    return clamp(
      amount / MAX_ROTATE,
      0,
      1
    );

  }


  /* ========================================================
     电脑鼠标
  ======================================================== */

  function handlePointerMove(event) {

    /*
     * 鼠标才进入这里
     */

    if (
      event.pointerType &&
      event.pointerType !== "mouse"
    ) {

      return;

    }


    const x =
      event.clientX /
      window.innerWidth;


    const y =
      event.clientY /
      window.innerHeight;


    /*
     * -1 ~ 1
     */

    const nx =
      (x - 0.5) * 2;


    const ny =
      (y - 0.5) * 2;


    /*
     * 卡牌旋转
     */

    targetY =
      nx * MAX_ROTATE;


    targetX =
      -ny * MAX_ROTATE;


    /*
     * 光源
     */

    targetLightX =
      50 + nx * 58;


    targetLightY =
      50 + ny * 58;

  }


  window.addEventListener(
    "pointermove",
    handlePointerMove,
    {
      passive: true
    }
  );


  /* ========================================================
     鼠标离开
  ======================================================== */

  window.addEventListener(
    "pointerleave",
    () => {

      targetX = 0;
      targetY = 0;

      targetLightX = 50;
      targetLightY = 50;

    },
    {
      passive: true
    }
  );


  /* ========================================================
     手机陀螺仪
  ======================================================== */

  function handleOrientation(event) {

    let beta =
      event.beta;

    let gamma =
      event.gamma;


    if (
      beta == null ||
      gamma == null
    ) {

      return;

    }


    /*
     * 第一次数据：
     * 当前姿态作为中心
     */

    if (
      baseBeta === null ||
      baseGamma === null
    ) {

      baseBeta = beta;
      baseGamma = gamma;

      return;

    }


    /*
     * 计算相对转动
     */

    let deltaBeta =
      beta - baseBeta;


    let deltaGamma =
      gamma - baseGamma;


    /*
     * 防止突然跳变
     */

    deltaBeta =
      clamp(
        deltaBeta,
        -35,
        35
      );


    deltaGamma =
      clamp(
        deltaGamma,
        -35,
        35
      );


    /*
     * 转成卡牌旋转
     */

    targetX =
      -(deltaBeta / 28)
      * MAX_ROTATE;


    targetY =
      (deltaGamma / 28)
      * MAX_ROTATE;


    targetX =
      clamp(
        targetX,
        -MAX_ROTATE,
        MAX_ROTATE
      );


    targetY =
      clamp(
        targetY,
        -MAX_ROTATE,
        MAX_ROTATE
      );


    /*
     * 光源位置
     */

    targetLightX =
      50 +
      (deltaGamma / 35) * 58;


    targetLightY =
      50 +
      (deltaBeta / 35) * 58;

  }


  /* ========================================================
     启动传感器
  ======================================================== */

  async function startSensors() {

    if (sensorStarted) {

      return;

    }


    sensorStarted = true;


    /*
     * 先注册事件
     */

    window.addEventListener(
      "deviceorientation",
      handleOrientation,
      true
    );


    /*
     * iPhone 权限
     */

    try {

      if (

        typeof DeviceOrientationEvent !==
        "undefined"

        &&

        typeof
        DeviceOrientationEvent.requestPermission
        ===
        "function"

      ) {

        const permission =
          await
          DeviceOrientationEvent
          .requestPermission();


        if (
          permission !==
          "granted"
        ) {

          sensorStarted = false;

          window.removeEventListener(
            "deviceorientation",
            handleOrientation,
            true
          );

          return;

        }

      }

    } catch (error) {

      console.log(
        "Orientation permission:",
        error
      );

      sensorStarted = false;

      window.removeEventListener(
        "deviceorientation",
        handleOrientation,
        true
      );

    }

  }


  /* ========================================================
     手机第一次触摸
  ======================================================== */

  window.addEventListener(
    "pointerdown",
    (event) => {

      if (
        event.pointerType === "touch" ||
        event.pointerType === "pen"
      ) {

        startSensors();

      }

    },
    {
      passive: true
    }
  );


  /*
   * Safari 兼容
   */

  window.addEventListener(
    "touchstart",
    () => {

      startSensors();

    },
    {
      passive: true
    }
  );


  /* ========================================================
     双击重新校准
  ======================================================== */

  let lastTap = 0;


  window.addEventListener(
    "touchend",
    () => {

      const now =
        Date.now();


      if (
        now - lastTap <
        320
      ) {

        baseBeta = null;
        baseGamma = null;

      }


      lastTap = now;

    },
    {
      passive: true
    }
  );


  /* ========================================================
     动画
  ======================================================== */

  function animate() {

    /*
     * 旋转缓动
     */

    currentX =
      lerp(
        currentX,
        targetX,
        SENSOR_SMOOTH
      );


    currentY =
      lerp(
        currentY,
        targetY,
        SENSOR_SMOOTH
      );


    /*
     * 光源缓动
     */

    lightX =
      lerp(
        lightX,
        targetLightX,
        0.14
      );


    lightY =
      lerp(
        lightY,
        targetLightY,
        0.14
      );


    /*
     * 全息膜跟随卡牌
     */

    holoX =
      lerp(
        holoX,
        currentY * 2.15,
        0.10
      );


    holoY =
      lerp(
        holoY,
        currentX * 1.65,
        0.10
      );


    /*
     * 闪光带位置
     */

    flashX =
      lerp(
        flashX,
        currentY * 3.8,
        0.13
      );


    flashY =
      lerp(
        flashY,
        currentX * 2.2,
        0.13
      );


    /*
     * 当前倾斜程度
     */

    const tilt =
      getTiltAmount();


    /*
     * 倾斜越明显：
     * 闪光越强
     */

    const specular =
      0.55 +
      tilt * 0.42;


    const flashOpacity =
      0.35 +
      tilt * 0.82;


    const colorFlashOpacity =
      0.34 +
      tilt * 0.62;


    /* ======================================================
       写 CSS
    ====================================================== */

    rotator.style.setProperty(
      "--rx",
      `${currentX}deg`
    );


    rotator.style.setProperty(
      "--ry",
      `${currentY}deg`
    );


    rotator.style.setProperty(
      "--light-x",
      `${lightX}%`
    );


    rotator.style.setProperty(
      "--light-y",
      `${lightY}%`
    );


    rotator.style.setProperty(
      "--holo-x",
      `${holoX}%`
    );


    rotator.style.setProperty(
      "--holo-y",
      `${holoY}%`
    );


    rotator.style.setProperty(
      "--flash-x",
      `${flashX}%`
    );


    rotator.style.setProperty(
      "--flash-y",
      `${flashY}%`
    );


    rotator.style.setProperty(
      "--specular-opacity",
      specular
    );


    rotator.style.setProperty(
      "--flash-opacity",
      flashOpacity
    );


    rotator.style.setProperty(
      "--color-flash-opacity",
      colorFlashOpacity
    );


    requestAnimationFrame(
      animate
    );

  }


  animate();


  /* ========================================================
     禁止拖图
  ======================================================== */

  document.addEventListener(
    "dragstart",
    (event) => {

      event.preventDefault();

    }
  );

})();

</script>

</body>
</html>
